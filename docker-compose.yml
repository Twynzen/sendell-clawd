services:
  sendell-gateway:
    image: ${SENDELL_IMAGE:-sendell:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      SENDELL_GATEWAY_TOKEN: ${SENDELL_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${SENDELL_CONFIG_DIR}:/home/node/.sendell
      - ${SENDELL_WORKSPACE_DIR}:/home/node/sendell
    ports:
      - "${SENDELL_GATEWAY_PORT:-18789}:18789"
      - "${SENDELL_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${SENDELL_GATEWAY_BIND:-lan}",
        "--port",
        "${SENDELL_GATEWAY_PORT:-18789}"
      ]

  sendell-cli:
    image: ${SENDELL_IMAGE:-sendell:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${SENDELL_CONFIG_DIR}:/home/node/.sendell
      - ${SENDELL_WORKSPACE_DIR}:/home/node/sendell
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
