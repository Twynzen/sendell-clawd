services:
  - type: web
    name: sendell
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: SENDELL_STATE_DIR
        value: /data/.sendell
      - key: SENDELL_WORKSPACE_DIR
        value: /data/workspace
      - key: SENDELL_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: sendell-data
      mountPath: /data
      sizeGB: 1
